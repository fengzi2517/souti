# Alembic 配置：数据库 URL 不写在这里，由 migrations/env.py 从应用配置(.env)读取
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# sqlalchemy.url 留空，运行时注入（见 migrations/env.py）

# 已有数据库（曾用 create_all 建表）首次接入迁移时执行：
#   alembic stamp head    # 只打标记不执行 DDL
# 全新环境：
#   alembic upgrade head  # 建表
# 后续改 models 后：
#   alembic revision --autogenerate -m "描述" && alembic upgrade head

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
